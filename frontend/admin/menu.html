<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <a href="index.html" style="color: #c8a97e; text-decoration: none; display: block; margin-bottom: 20px;">&larr; Назад в меню</a>
    <title>Управление меню</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #111;
            color: #fff;
            padding: 20px;
        }

        h2 {
            color: #c8a97e;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #aaa;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #c8a97e;
            color: #000;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
        }

        #status {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }

        /* === СТИЛИ ФИЛЬТРАЦИИ === */
        .menu-tabs {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab-btn {
            width: auto; /* Отменяет 100% ширину из глобального button */
            padding: 10px 15px;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 14px;
            margin-top: 0; /* Отменяет отступ из глобального button */
        }

            .tab-btn.active {
                background: #c8a97e;
                color: #000;
                font-weight: bold;
                border-color: #c8a97e;
            }

        /* === НОВЫЕ СТИЛИ ДЛЯ СЕТКИ И КАРТОЧЕК МЕНЮ === */
        #admin-menu-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .menu-card {
            background: #222;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            height: 100%;
            box-sizing: border-box;
        }

            .menu-card:hover {
                border-color: #c8a97e;
            }

            .menu-card img {
                width: 100%;
                height: 150px;
                object-fit: cover;
                border-radius: 4px;
                margin-bottom: 10px;
                display: block;
            }
    </style>
</head>
<body>
    <h2>Добавить блюдо</h2>
    <form id="dishForm">
        <div class="form-group">
            <label>Категория</label>
            <select name="category" required>
                <option value="kitchen" selected>Кухня</option>
                <option value="cocktails">Коктейли</option>
                <option value="bar">Пиво и Напитки</option>
            </select>
        </div>
        <div class="form-group">
            <label>Название</label>
            <input type="text" name="name" required placeholder="Бургер классика">
        </div>
        <div class="form-group">
            <label>Цена (₽)</label>
            <input type="number" name="cost" required placeholder="450">
        </div>
        <div class="form-group">
            <label>Описание</label>
            <textarea name="description" rows="3" placeholder="Состав..."></textarea>
        </div>
        <div class="form-group">
            <label>Фотография</label>
            <input type="file" name="image" accept="image/*" required>
        </div>
        <input type="hidden" name="id" id="dishId" value="">

        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button type="submit" id="submitBtn" style="flex: 1;">Добавить в меню</button>
            <button type="button" id="updateBtn" style="flex: 1; display: none; background: #c8a97e; color: #000; ">Изменить</button>
            <button type="button" id="deleteBtn" style="flex: 1; display: none; background: #c8a97e; color: #000; ">Удалить</button>
        </div>
        <button type="button" id="cancelEditBtn" style="display: none; background: #555; color: #fff; margin-top: 10px;">Отменить редактирование</button>
        <div id="status"></div>
    </form>

    <h3 style="color: #c8a97e; text-align: center; margin-top: 40px;">Текущее меню</h3>

    <div class="menu-tabs">
        <button class="tab-btn active" onclick="filterAdminMenu('all', event)">Все</button>
        <button class="tab-btn" onclick="filterAdminMenu('kitchen', event)">Кухня</button>
        <button class="tab-btn" onclick="filterAdminMenu('cocktails', event)">Коктейли</button>
        <button class="tab-btn" onclick="filterAdminMenu('bar', event)">Пиво и Напитки</button>
    </div>

    <div id="admin-menu-container" ...>
        <div id="admin-menu-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px;">
            <p class="loading" style="text-align: center; width: 100%;">Загрузка меню...</p>
        </div>

        <script>
            document.getElementById('dishForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const statusBlock = document.getElementById('status');
                statusBlock.style.color = '#fff';
                statusBlock.innerText = 'Отправка...';

                const formData = new FormData(e.target);

                try {
                    const response = await fetch('/api/admin/addDish', {
                        method: 'POST',
                        body: formData // Браузер сам подставит нужные multipart заголовки
                    });

                    if (response.ok) {
                        statusBlock.style.color = '#4caf50';
                        statusBlock.innerText = 'Успешно добавлено!';
                        e.target.reset();
                        fetchAdminMenu();
                    } else {
                        statusBlock.style.color = '#f44336';
                        statusBlock.innerText = 'Ошибка сервера: ' + response.status;
                    }
                } catch (err) {
                    statusBlock.style.color = '#f44336';
                    statusBlock.innerText = 'Ошибка сети';
                }
            });

            // === ЛОГИКА ОТОБРАЖЕНИЯ МЕНЮ И ВЫБОРА КАРТОЧКИ ===

            let currentAdminDishes = [];

            async function fetchAdminMenu(category = 'all') {
                const container = document.getElementById('admin-menu-container');
                try {
                    const response = await fetch(`/api/menu?category=${category}`);
                    if (!response.ok) throw new Error(`HTTP error: ${response.status}`);
                    currentAdminDishes = await response.json();
                    renderAdminMenu(currentAdminDishes);
                } catch (err) {
                    console.warn('Сервер недоступен:', err);
                    container.innerHTML = '<p style="color: red;">Ошибка загрузки меню.</p>';
                }
            }

            // Отрисовка карточек в админке
            function renderAdminMenu(dishes) {
                const container = document.getElementById('admin-menu-container');
                if (!dishes || dishes.length === 0) {
                    container.innerHTML = '<p>Меню пусто.</p>';
                    return;
                }

                container.innerHTML = dishes.map(dish => {
                    const imageUrl = dish.imageUrl || dish.image_url || 'img/dish-placeholder.png';
                    const name = dish.name || 'Без названия';
                    const cost = dish.cost || 0;
                    const category = dish.category || 'all';

                    return `
                        <div class="menu-card"
                             onclick="fillFormForEdit(${dish.id})"
                             style="background: #222; border: 1px solid #444; border-radius: 8px; padding: 15px; cursor: pointer; transition: 0.2s;">
                            <img src="${imageUrl}" style="width: 100%; height: 150px; object-fit: cover; border-radius: 4px; margin-bottom: 10px;">
                            <div style="font-weight: bold;">${name}</div>
                            <div style="color: #c8a97e;">${cost} ₽</div>
                            <div style="font-size: 12px; color: #888; margin-top: 5px;">Категория: ${category}</div>
                        </div>
                    `;
                }).join('');
            }

            function filterAdminMenu(category, event) {
                document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
                if (event && event.target) {
                    event.target.classList.add('active');
                }
                fetchAdminMenu(category);
            }

            function fillFormForEdit(dishId) {
                const dish = currentAdminDishes.find(d => d.id === dishId);
                if (!dish) return;

                const form = document.getElementById('dishForm');
                document.getElementById('dishId').value = dish.id;
                form.name.value = dish.name;
                form.cost.value = dish.cost;
                form.description.value = dish.description || '';
                form.category.value = dish.category || 'kitchen';

                form.image.required = false;

                document.getElementById('submitBtn').style.display = 'none';
                document.getElementById('updateBtn').style.display = 'block';
                document.getElementById('deleteBtn').style.display = 'block';
                document.getElementById('cancelEditBtn').style.display = 'block';

                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            function resetFormToCreate() {
                const form = document.getElementById('dishForm');
                form.reset();
                document.getElementById('dishId').value = '';
                form.image.required = true;

                document.getElementById('submitBtn').style.display = 'block';
                document.getElementById('updateBtn').style.display = 'none';
                document.getElementById('deleteBtn').style.display = 'none';
                document.getElementById('cancelEditBtn').style.display = 'none';

                document.getElementById('status').innerText = '';
            }

            document.getElementById('cancelEditBtn').addEventListener('click', resetFormToCreate);

            // === ЛОГИКА ОТПРАВКИ ЗАПРОСОВ ===

            // Вспомогательная функция для отправки
            async function sendAdminRequest(url, method, formData) {
                const statusBlock = document.getElementById('status');
                statusBlock.style.color = '#fff';
                statusBlock.innerText = 'Обработка...';

                try {
                    const response = await fetch(url, { method: method, body: formData });
                    if (response.ok) {
                        statusBlock.style.color = '#4caf50';
                        statusBlock.innerText = 'Успешно!';
                        resetFormToCreate();
                        fetchAdminMenu(); // Перезагружаем список
                    } else {
                        statusBlock.style.color = '#f44336';
                        statusBlock.innerText = 'Ошибка сервера: ' + response.status;
                    }
                } catch (err) {
                    statusBlock.style.color = '#f44336';
                    statusBlock.innerText = 'Ошибка сети';
                }
            }

            // Обработчик кнопки "Изменить"
            document.getElementById('updateBtn').addEventListener('click', () => {
                const form = document.getElementById('dishForm');
                if (!form.reportValidity()) return; // Проверка валидации браузером

                const formData = new FormData(form);
                // Вызов твоего будущего бэкенд метода changeDish
                sendAdminRequest('/api/admin/changeDish', 'POST', formData);
            });

            // Обработчик кнопки "Удалить"
            document.getElementById('deleteBtn').addEventListener('click', () => {
                if (!confirm('Вы уверены, что хотите удалить это блюдо?')) return;

                const dishId = document.getElementById('dishId').value;
                const formData = new FormData();
                formData.append('id', dishId);

                // Вызов твоего будущего бэкенд метода deleteDish
                sendAdminRequest('/api/admin/deleteDish', 'POST', formData);
            });

            // Запускаем загрузку меню при открытии страницы
            window.addEventListener('DOMContentLoaded', () => fetchAdminMenu());



        </script>


</body>
</html>
