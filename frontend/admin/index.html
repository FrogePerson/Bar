<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Панель управления баром</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #111;
            color: #fff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            box-sizing: border-box;
        }

        h2 {
            color: #c8a97e;
            text-align: center;
            margin-bottom: 40px;
            font-size: 24px;
        }

        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 400px;
        }

        .admin-btn {
            display: block;
            width: 100%;
            padding: 20px;
            background: #222;
            color: #fff;
            text-decoration: none;
            text-align: center;
            border: 1px solid #444;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.2s ease-in-out;
            box-sizing: border-box;
        }

        /* Выделяем самую частую кнопку золотистым цветом */
        .admin-btn.primary {
            background: #c8a97e;
            color: #000;
            border-color: #c8a97e;
        }

        .admin-btn:active {
            transform: scale(0.98);
        }

        .admin-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            position: relative;
        }

        /* Метка для кнопок, которые пока не работают */
        .admin-btn.disabled::after {
            content: "(в разработке)";
            display: block;
            font-size: 12px;
            font-weight: 400;
            margin-top: 5px;
            color: #888;
        }
    </style>
</head>

<body>
    <h2>Панель управления</h2>

    <div class="menu-grid">
        <!-- Ведет на файл редактирования меню (твой старый код) -->
        <a href="menu.html" class="admin-btn primary">Редактирование меню</a>

        <!-- Заглушки, которые пока ведут на текущую страницу (или никуда) -->
        <a href="#" class="admin-btn disabled">Редактирование событий</a>
        <a href="#" class="admin-btn disabled">Редактирование галереи</a>
        <a href="#" class="admin-btn disabled">Управление сервером</a>
    </div>
</body>

</html>
