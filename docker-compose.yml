version: '3.8'

networks:
  bar-net:
    driver: overlay

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    networks:
      - bar-net
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    deploy:
      replicas: 1

  backend:
    # build: .
    image: ghcr.io/frogeperson/bar-backend:latest
    networks:
      - bar-net
    depends_on:
      - db
    deploy:
      replicas: 1

  db:
    image: postgres:16-alpine
    networks:
      - bar-net
    environment:
      - POSTGRES_USER=app_user
      - POSTGRES_PASSWORD=local_password
      - POSTGRES_DB=bar_db
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    deploy:
      replicas: 1