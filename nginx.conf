server {
    listen 80;
    server_name localhost;

    # 1. Отдача статики
    # Указываем корневую папку, куда мы пробросим файлы внутри контейнера
    root /usr/share/nginx/html;
    index index.html;

    # Любой запрос пытаемся найти как файл на диске
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кэширование картинок и стилей на стороне браузера (оптимизация)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 2. Проксирование API запросов к C++ бэкенду
    location /api/ {
        # 'backend' - это имя сервиса из docker-compose.yml
        # Внутренний DNS докера сам разрешит его в IP-адрес C++ контейнера
        proxy_pass http://backend:8080;
        
        # Передаем реальные IP-адреса и заголовки бэкенду
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}